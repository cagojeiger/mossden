name: '[ci][core-request][gh-linux] Build & Test'
run-name: Core ci ${{ fromJSON(inputs.request).request.run_id }}.${{ fromJSON(inputs.request).request.attempt }} ${{ fromJSON(inputs.request).request.tested_sha }}

on:
  workflow_dispatch:
    inputs:
      request:
        description: Immutable Core CI request
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mossden-ci-${{ fromJSON(inputs.request).request.event == 'pull_request' && format('pr-{0}', fromJSON(inputs.request).request.pr_number) || format('run-{0}', fromJSON(inputs.request).request.run_id) }}
  cancel-in-progress: ${{ fromJSON(inputs.request).request.event == 'pull_request' }}

jobs:
  gate:
    name: Validate core request
    if: >-
      github.repository_id == '1444279727' && github.ref == 'refs/heads/main' &&
      github.actor_id == '352203391' && github.run_attempt == 1
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      core_sha: ${{ steps.gate.outputs.core_sha }}
      tested_sha: ${{ steps.gate.outputs.tested_sha }}
      rust: ${{ steps.gate.outputs.rust }}
    steps:
      - name: Mint scoped Core read token
        id: reader
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: mossden-core
          permission-contents: read
          permission-actions: read
      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/mossden-core
          ref: main
          token: ${{ steps.reader.outputs.token }}
          path: .control
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Validate immutable Core request
        id: gate
        working-directory: .control
        env:
          CORE_TOKEN: ${{ steps.reader.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          REQUEST_JSON: ${{ inputs.request }}
        run: python3 .github/scripts/ci_bridge.py gate >> "$GITHUB_OUTPUT"
      - name: Summarize selected checks
        env:
          CHECK_SCOPE: ${{ steps.gate.outputs.scope }}
        run: printf 'Check scope %s\n' "$CHECK_SCOPE" >> "$GITHUB_STEP_SUMMARY"

  hygiene:
    name: Hygiene
    needs: gate
    uses: ./.github/workflows/ci-worker.yml
    with:
      check: hygiene
      request: ${{ inputs.request }}
      core_sha: ${{ needs.gate.outputs.core_sha }}
      tested_sha: ${{ needs.gate.outputs.tested_sha }}
      rust: ${{ needs.gate.outputs.rust == 'true' }}
    secrets: inherit

  lint:
    name: Rust Lint
    needs: gate
    uses: ./.github/workflows/ci-worker.yml
    with:
      check: lint
      request: ${{ inputs.request }}
      core_sha: ${{ needs.gate.outputs.core_sha }}
      tested_sha: ${{ needs.gate.outputs.tested_sha }}
      rust: ${{ needs.gate.outputs.rust == 'true' }}
    secrets: inherit

  build:
    name: Rust Build
    needs: gate
    uses: ./.github/workflows/ci-worker.yml
    with:
      check: build
      request: ${{ inputs.request }}
      core_sha: ${{ needs.gate.outputs.core_sha }}
      tested_sha: ${{ needs.gate.outputs.tested_sha }}
      rust: ${{ needs.gate.outputs.rust == 'true' }}
    secrets: inherit

  audit:
    name: Rust Audit
    needs: gate
    uses: ./.github/workflows/ci-worker.yml
    with:
      check: audit
      request: ${{ inputs.request }}
      core_sha: ${{ needs.gate.outputs.core_sha }}
      tested_sha: ${{ needs.gate.outputs.tested_sha }}
      rust: ${{ needs.gate.outputs.rust == 'true' }}
    secrets: inherit

  result:
    name: Rust
    if: always()
    needs: [gate, hygiene, lint, build, audit]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require the selected checks
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUN_RUST: ${{ needs.gate.outputs.rust }}
        run: |
          test "$GATE_RESULT" = success
          test "$HYGIENE_RESULT" = success
          test "$AUDIT_RESULT" = success
          expected=skipped
          if [[ "$RUN_RUST" == true ]]; then expected=success; fi
          test "$LINT_RESULT" = "$expected"
          test "$BUILD_RESULT" = "$expected"
